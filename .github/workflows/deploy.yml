name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 생성 데이터(current.json·히스토리)는 master 가 아니라 data 전용 브랜치에
      # 산다. 코드 히스토리가 매 30분 갱신되는 JSON 으로 오염되지 않도록.
      # data 브랜치가 아직 없는 첫 배포에서도 사이트는 떠야 하므로 실패를 삼킨다.
      - name: Fetch data files (data 브랜치)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            for name in current rates fx credit issuers; do
              git show "FETCH_HEAD:data/$name.json" > "data/$name.json" \
                || echo "data/$name.json 없음 — 건너뜀"
            done
          else
            echo "data 브랜치가 아직 없습니다 — 빈 데이터로 배포합니다."
            echo '{"generated_at":null,"rates":{},"fx":{},"credit":{},"curves":{},"offerings":[]}' > data/current.json
          fi

      # 허브용 요약(Value Compass 발행 데이터 계약 v1) — data 브랜치의
      # data/summary.json·version.json 을 Pages 루트로. 사이트의 data/ 와 섞지 않게
      # 따로 받는다. 받을 수 없으면(도입 직후 등) current.json 에서 오프라인으로 만든다.
      - name: Fetch summary (data 브랜치)
        run: |
          mkdir -p vc-summary
          if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            for name in summary version; do
              git show "FETCH_HEAD:data/$name.json" > "vc-summary/$name.json" 2>/dev/null \
                || rm -f "vc-summary/$name.json"
            done
          fi

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp templates/index.html _site/index.html
          cp manifest.webmanifest _site/manifest.webmanifest
          # static/ 에는 value-invest 에서 벤더링한 vc-shell.js·vc-tokens.css 도 들어 있다.
          cp -r static _site/static
          cp -r data _site/data

      - name: Publish summary.json (Pages 루트)
        run: |
          if [ -s vc-summary/summary.json ] && [ -s vc-summary/version.json ]; then
            cp vc-summary/summary.json vc-summary/version.json _site/
          else
            python3 -m bondmate.summary --data data --out _site \
              || echo "summary 를 만들지 못했습니다 — 허브는 current.json 으로 폴백합니다."
          fi
          # 계약 위반 파일은 싣지 않는다(허브가 레거시 경로로 폴백하게).
          if [ -f _site/summary.json ] && ! python3 bondmate/vc_publish.py validate _site/summary.json; then
            rm -f _site/summary.json _site/version.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
